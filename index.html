<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Game Night</title>
<style>
:root{
  --bg:#0e1116; --bg2:#161b23; --card:#1b212b; --card2:#222a36; --bg3:rgba(255,255,255,.05);
  --line:#2b3441; --txt:#e8edf4; --dim:#93a1b3; --dimmer:#64748b;
  --acc:#5eead4; --acc2:#38bdf8; --hot:#fb7185; --warm:#fbbf24; --cool:#a78bfa;
  --onacc:#06231f; --onacc2:#062130;
  --scrim:rgba(14,17,22,.9);
  --chipimg-bg:rgba(14,17,22,.78); --chipimg-line:rgba(255,255,255,.13);
  --accsoft:rgba(94,234,212,.16); --accln:rgba(94,234,212,.32); --accfill:rgba(94,234,212,.22);
  --warmln:rgba(251,191,36,.4);
  --gold:#facc15; --goldbg:rgba(250,204,21,.15); --goldln:rgba(250,204,21,.34);
  --goldbg2:rgba(250,204,21,.07); --goldln2:rgba(250,204,21,.2);
  --neutbg:rgba(148,163,184,.08); --neutln:rgba(148,163,184,.22); --barbg:rgba(148,163,184,.16);
  --w1:#5eead4; --w2:#38bdf8; --w3:#a78bfa; --w4:#fbbf24; --w5:#fb7185;
  /* the fade under the cover art stays dark in both themes -- it sits on the
     artwork, not on the page, and keeps the badges legible over any image */
  --imgfade1:rgba(14,17,22,.92); --imgfade2:rgba(14,17,22,.25);
  --r:16px;
}

/* Light palette. This design is dark-first, so :root above is the complete dark
   set and light is the override: it applies when the OS asks for light and the
   reader has not pinned dark, or when they pick light explicitly. */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){ 
    --bg:#f4f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f6; --bg3:rgba(15,23,32,.05);
    --line:#dce3ea; --txt:#0f1720; --dim:#5b6875; --dimmer:#8b97a4;
    --acc:#0d9488; --acc2:#0369a1; --hot:#e11d48; --warm:#b45309; --cool:#7c3aed;
    --onacc:#ffffff; --onacc2:#ffffff;
    --scrim:rgba(244,246,248,.9);
    --chipimg-bg:rgba(255,255,255,.9); --chipimg-line:rgba(15,23,32,.14);
    --accsoft:rgba(13,148,136,.12); --accln:rgba(13,148,136,.32); --accfill:rgba(13,148,136,.2);
    --warmln:rgba(180,83,9,.35);
    --gold:#a16207; --goldbg:rgba(161,98,7,.1); --goldln:rgba(161,98,7,.3);
    --goldbg2:rgba(161,98,7,.06); --goldln2:rgba(161,98,7,.18);
    --neutbg:rgba(100,116,139,.07); --neutln:rgba(100,116,139,.2); --barbg:rgba(100,116,139,.18);
    --w1:#0d9488; --w2:#0369a1; --w3:#7c3aed; --w4:#b45309; --w5:#e11d48;
   }
}
:root[data-theme="light"]{ 
    --bg:#f4f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#eef2f6; --bg3:rgba(15,23,32,.05);
    --line:#dce3ea; --txt:#0f1720; --dim:#5b6875; --dimmer:#8b97a4;
    --acc:#0d9488; --acc2:#0369a1; --hot:#e11d48; --warm:#b45309; --cool:#7c3aed;
    --onacc:#ffffff; --onacc2:#ffffff;
    --scrim:rgba(244,246,248,.9);
    --chipimg-bg:rgba(255,255,255,.9); --chipimg-line:rgba(15,23,32,.14);
    --accsoft:rgba(13,148,136,.12); --accln:rgba(13,148,136,.32); --accfill:rgba(13,148,136,.2);
    --warmln:rgba(180,83,9,.35);
    --gold:#a16207; --goldbg:rgba(161,98,7,.1); --goldln:rgba(161,98,7,.3);
    --goldbg2:rgba(161,98,7,.06); --goldln2:rgba(161,98,7,.18);
    --neutbg:rgba(100,116,139,.07); --neutln:rgba(100,116,139,.2); --barbg:rgba(100,116,139,.18);
    --w1:#0d9488; --w2:#0369a1; --w3:#7c3aed; --w4:#b45309; --w5:#e11d48;
   }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--scrim);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.brand h1{margin:0;font-size:19px;letter-spacing:-.3px;font-weight:700}
.brand .n{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:8px;margin-bottom:9px}
.search{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:0 11px;height:38px;
}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;min-width:0}
.search input::placeholder{color:var(--dimmer)}
.search svg{color:var(--dimmer);flex:0 0 auto}
/* theme toggle: show the icon for the mode you'd switch TO */
#theme .moon{display:none}
:root[data-theme="light"] #theme .moon{display:block}
:root[data-theme="light"] #theme .sun{display:none}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) #theme .moon{display:block}
  :root:not([data-theme="dark"]) #theme .sun{display:none}
}
.iconbtn{
  width:38px;height:38px;flex:none;display:grid;place-items:center;
  background:var(--bg2);border:1px solid var(--line);border-radius:11px;color:var(--dim);
}
.iconbtn.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}

/* filter chip strip */
.strip{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--bg2);border:1px solid var(--line);color:var(--dim);
}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip.clear{background:none;border-color:transparent;color:var(--hot);font-weight:500}

/* ---------- filter drawer ---------- */
.drawer{display:none;padding:2px 0 12px;border-top:1px solid var(--line);margin-top:2px}
.drawer.open{display:block}
.fgroup{margin:12px 0 0}
.flabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin-bottom:7px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{
  padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--bg2);border:1px solid var(--line);color:var(--dim);
}
.opt.on{background:var(--acc2);border-color:var(--acc2);color:var(--onacc2)}

/* ---- vibe panel + tonight's match ---- */
.vrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.vrow .vname{flex:0 0 62px;font-size:12px;color:var(--dim);text-transform:capitalize}
.vrow input[type=range]{flex:1;accent-color:var(--acc2);height:18px}
.vrow .vval{flex:0 0 46px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.vrow.off .vname,.vrow.off .vval{opacity:.45}
.vrow.off input[type=range]{opacity:.35}
.vrow .vtog{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--dim);cursor:pointer;font-size:12px;line-height:1;padding:0}
.vrow.on .vtog{background:var(--acc2);border-color:var(--acc2);color:var(--onacc2)}
.tonight{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px;
  background:var(--bg2);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tonight .tmain{flex:1 1 210px;min-width:0}
.tonight .teyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tonight h2{margin:4px 0 2px;font-size:19px;line-height:1.2}
.tonight .tmeta{font-size:12.5px;color:var(--dim)}
.tonight .tscore{font-size:26px;font-weight:700;color:var(--acc)}
.tonight .lowconf{display:inline-block;margin-left:6px;font-size:10.5px;color:var(--warm);
  border:1px solid var(--warmln);border-radius:5px;padding:1px 5px;vertical-align:2px}
.bestbar{display:flex;gap:3px;margin-top:9px}
.bestbar span{flex:1;text-align:center;font-size:10.5px;padding:3px 0;border-radius:5px;
  background:var(--bg3);color:var(--dim);border:1px solid transparent}
.bestbar span.best{background:var(--accsoft);color:var(--acc2);border-color:var(--accln);font-weight:700}
/* Bottom-left badge stack. Both the teach flag and the fit score want this
   corner, so they queue rather than overlap: fit score nearest the corner. */
.botleft{position:absolute;left:7px;bottom:7px;z-index:2;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mscore{font-size:11px;font-weight:700;padding:2px 6px;
  border-radius:6px;background:var(--chipimg-bg);color:var(--acc2);border:1px solid var(--accln);
  backdrop-filter:blur(6px)}

/* ---- vibe panel inside the game sheet ---- */
.vibebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.vradar{flex:0 0 auto;margin:-6px 0}
.vbars{flex:1 1 210px;min-width:0;display:flex;flex-direction:column;gap:6px}
.vbrow{display:grid;grid-template-columns:74px 1fr 30px;gap:9px;align-items:center}
.vbname{font-size:12.5px;color:var(--dim);text-transform:capitalize;
  display:flex;align-items:center;gap:4px;min-width:0}
.vbname i{font-style:normal;color:var(--acc2);font-size:10px}
.vbname.low{color:var(--warm)}
.vbbar{height:6px;border-radius:3px;background:var(--barbg);overflow:hidden}
.vbbar i{display:block;height:100%;border-radius:3px;background:var(--acc2)}
.vbval{font-size:12px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.vfoot{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.5}
.sortsel{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- grid ---------- */
main{padding:12px 12px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;
  transition:transform .12s ease;
}
.card:active{transform:scale(.975)}
.thumbwrap{position:relative;aspect-ratio:1/1;background:var(--bg2);overflow:hidden}
.thumbwrap img{width:100%;height:100%;object-fit:cover;display:block}
.thumbwrap::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--imgfade1) 0%,var(--imgfade2) 42%,transparent 70%);
}
.wbadge{
  position:absolute;top:7px;right:7px;z-index:2;
  font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;
  background:var(--chipimg-bg);backdrop-filter:blur(6px);border:1px solid var(--chipimg-line);
  font-variant-numeric:tabular-nums;
}
.rbadge{
  position:absolute;top:7px;left:7px;z-index:2;
  display:flex;align-items:center;gap:3px;
  font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;
  background:var(--chipimg-bg);backdrop-filter:blur(6px);border:1px solid var(--chipimg-line);
  font-variant-numeric:tabular-nums;
}
.cardbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.cname{
  font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.crow{display:flex;gap:9px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:auto}
.crow b{color:var(--txt);font-weight:700}
.wbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:2px}
.abadge{
  position:absolute;right:7px;bottom:7px;z-index:2;
  font-size:11px;font-weight:800;letter-spacing:.02em;padding:3px 7px;border-radius:7px;
  background:var(--goldbg);color:var(--gold);border:1px solid var(--goldln);
  backdrop-filter:blur(6px);
}
.awards{display:flex;flex-direction:column;gap:6px}
.award{
  display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt);
  background:var(--goldbg2);border:1px solid var(--goldln2);
  border-radius:9px;padding:8px 11px;
}
.award .medal{font-size:15px;line-height:1}
.award.dt{background:var(--neutbg);border-color:var(--neutln)}
.vbadge{
  font-size:10px;font-weight:800;letter-spacing:.02em;padding:3px 7px;border-radius:7px;
  background:var(--accsoft);color:var(--acc);border:1px solid var(--accln);
  backdrop-filter:blur(6px);
}

.empty{text-align:center;color:var(--dim);padding:60px 20px}
.foot{text-align:center;color:var(--dimmer);font-size:11.5px;padding:26px 12px 0}
.empty b{display:block;font-size:16px;color:var(--txt);margin-bottom:6px}

/* ---------- detail sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  visibility:hidden;
}
.sheet.open{transform:translateY(0);visibility:visible}
.shead{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:var(--scrim);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.shead .t{font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sbody{padding:14px 12px 60px}

.hero{display:flex;gap:12px;margin-bottom:14px}
.hero img{width:96px;height:96px;flex:none;border-radius:12px;object-fit:cover;background:var(--bg2)}
.hero .meta{flex:1;min-width:0}
.hero h2{margin:0 0 3px;font-size:19px;line-height:1.2;letter-spacing:-.4px}
.hero .yr{font-size:12.5px;color:var(--dim);margin-bottom:8px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.stat .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin-bottom:3px}
.stat .v{font-size:17px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--dim);margin-top:1px}

.sect{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin:18px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4.5px 10px;border-radius:8px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tag.best{background:var(--accsoft);color:var(--acc);border-color:var(--accln);font-weight:700}

.vidwrap{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playbtn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28)}
.playbtn span{
  width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);
  display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.45)
}
.vmeta{font-size:12px;color:var(--dim);margin-top:7px}
.novid{
  display:block;text-align:center;padding:26px 14px;border-radius:12px;
  background:var(--card);border:1px dashed var(--line);color:var(--acc2);font-weight:600;font-size:14px;
  text-decoration:none;
}
.links{display:flex;gap:8px;margin-top:20px}
.links a{
  flex:1;text-align:center;padding:12px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:13.5px;font-weight:600;
}
.desc{font-size:13.5px;color:var(--dim);line-height:1.55}
</style>
<script>
/* Apply a saved theme before first paint, so there is no flash of the wrong one.
   No saved choice means no data-theme, which lets the OS preference decide. */
try{var t=localStorage.getItem("gn-theme");
    if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}
</script>
</head>
<body>

<header>
  <div class="brand">
    <h1>Game Night</h1>
    <span class="n" id="count"></span>
  </div>
  <div class="searchrow">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search games…" autocomplete="off">
    </label>
    <button class="iconbtn" id="ftoggle" aria-label="Filters">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
    </button>
    <button class="iconbtn" id="theme" aria-label="Switch between light and dark">
      <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8.2 8.2 0 1 1 10.5 4a6.6 6.6 0 0 0 9.5 9.5z"/></svg>
    </button>
    <button class="iconbtn" id="vtoggle" aria-label="What fits tonight">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><path d="M12 8l3.9 2.2v4.6L12 17l-3.9-2.2v-4.6z"/></svg>
    </button>
    <button class="iconbtn" id="dice" aria-label="Pick random game">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="strip" id="quick"></div>
  <div class="drawer" id="drawer"></div>
  <div class="drawer vibe" id="vibe"></div>
</header>

<main>
  <div id="tonight"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><b>Nothing matches</b>Loosen a filter and try again.</div>
  <div class="foot" id="foot"></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="shead">
    <button class="iconbtn" id="close" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="t" id="sheetTitle"></div>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>

<script>
/* ============================================================
   DATA — replace GAMES with the live BGG pull.
   Fields: id, name, year, thumb, minP, maxP, best[], time,
           weight, rating, myRating, rank, mech[], cat[],
           video (YouTube id), vtitle, vchan, desc
   ============================================================ */

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
/* Everything below builds HTML with template strings, which do not escape.
   The data is BGG's, so it carries & and could carry < after any refresh. */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
/* A–Z sort key: fold accents and ignore a leading "The", matching the order of GAMES above */
const sortName=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/^the\s+/,"");
const wColor=w=> "var(--w"+(w<2?1:w<2.75?2:w<3.5?3:w<4.25?4:5)+")";
const wLabel=w=> w<2?"Light" : w<2.75?"Light-med" : w<3.5?"Medium" : w<4.25?"Med-heavy" : "Heavy";

// Card badge text: the headline award if there is one, else a short label.
// Note "Kennerspiel des Jahres" does not contain "Spiel des Jahres" (lowercase
// s), so match the whole family explicitly.
const awardShort = g => {
  const list = g.awards || [];
  const jahres = list.find(a => /(Spiel|Kennerspiel|Kinderspiel) des Jahres/.test(a));
  if (jahres) {
    const year = jahres.slice(0, 4);
    if (/Kennerspiel/.test(jahres)) return "Kennerspiel " + year;
    if (/Kinderspiel/.test(jahres)) return "Kinderspiel " + year;
    return "SdJ " + year;
  }
  if (list.length > 1) return list.length + " awards";
  const one = (list[0] || "").replace(/^\d{4} /, "");
  if (/Golden Geek/.test(one)) return "Golden Geek";
  if (/Deutscher Spiele Preis/.test(one)) return "Dt. Spiele Preis";
  if (/International Gamers/.test(one)) return "Intl. Gamers";
  return one.length > 18 ? "award winner" : one;
};

const timeStr=m=> !m ? "–" : m>=60 ? (m%60? (m/60).toFixed(1).replace(/\.0$/,"")+" hr" : (m/60)+" hr") : m+" min";
const timeRange=g=> (g.minT&&g.minT!==g.time) ? timeStr(g.minT)+"–"+timeStr(g.time) : timeStr(g.time);
const plStr=g=> g.minP===g.maxP ? g.minP+"p" : g.minP+"–"+g.maxP+"p";

/* ---------- filter state ---------- */
const S={q:"",players:0,twoOnly:false,time:0,weight:"",mech:"",sort:"rating",vid:false,award:false,
  vibe:{cozy:null,chatty:null,silly:null,cutthroat:null,tense:null,crunchy:null,swingy:null,storied:null},vplayers:0,vtime:0};

const TIME_OPTS=[{v:30,l:"≤30 min"},{v:60,l:"≤1 hr"},{v:90,l:"≤1.5 hr"},{v:120,l:"≤2 hr"}];
const W_OPTS=[{v:"light",l:"Light"},{v:"medium",l:"Medium"},{v:"heavy",l:"Heavy"}];
const SORTS=[{v:"rating",l:"Top rated"},{v:"mine",l:"My rating"},{v:"rank",l:"BGG rank"},{v:"name",l:"A–Z"},{v:"time",l:"Shortest"},{v:"weight",l:"Lightest"}];
const mechCount={}; GAMES.forEach(g=>(g.mech||[]).forEach(m=>mechCount[m]=(mechCount[m]||0)+1));
const allMech=Object.keys(mechCount).filter(m=>mechCount[m]>=3).sort((a,b)=>mechCount[b]-mechCount[a]||a.localeCompare(b));

function matches(g){
  if(S.q && !norm(g.name).includes(norm(S.q))) return false;
  if(S.players && !(g.minP<=S.players && g.maxP>=S.players)) return false;
  if(S.twoOnly && g.maxP!==2) return false;
  if(S.time && g.time>S.time) return false;
  // Bands are wLabel's own boundaries, so a card never reads "Light-med" and
  // then hides from the Light filter. Light = Light+Light-med, Heavy = Med-heavy+Heavy.
  if(S.weight==="light"  && !(g.weight<2.75)) return false;
  if(S.weight==="medium" && !(g.weight>=2.75 && g.weight<3.5)) return false;
  if(S.weight==="heavy"  && !(g.weight>=3.5)) return false;
  if(S.mech && !(g.mech||[]).includes(S.mech)) return false;
  if(S.vid && !g.video) return false;
  if(S.award && !(g.awards&&g.awards.length)) return false;
  return true;
}
function sorted(list){
  const c={
    rating:(a,b)=>(b.rating||0)-(a.rating||0)||(b.geek||0)-(a.geek||0),
    mine:(a,b)=>(b.myRating||0)-(a.myRating||0),
    rank:(a,b)=>(a.rank||99999)-(b.rank||99999),
    name:(a,b)=>sortName(a.name).localeCompare(sortName(b.name)),
    time:(a,b)=>(a.time||0)-(b.time||0),
    weight:(a,b)=>(a.weight||0)-(b.weight||0),
  }[S.sort];
  return [...list].sort(c);
}

/* Buttons that stay pressed need aria-pressed. Mirroring .on after a render
   beats threading the attribute through every template. */
function syncPressed(){
  document.querySelectorAll("#quick .chip:not(.clear),#drawer .opt,#vibe .opt:not([data-vreset])")
    .forEach(b=>b.setAttribute("aria-pressed",b.classList.contains("on")));
  document.querySelectorAll("#vibe .vtog")
    .forEach(b=>b.setAttribute("aria-pressed",b.closest(".vrow").classList.contains("on")));
}

/* ---------- render: grid ---------- */
/* ---------- vibes: "what fits tonight" (spec section 6) ---------- */
/* Order is not cosmetic: on a radar, neighbouring axes form the polygon edges.
   Correlated axes sit together and anticorrelated ones sit opposite, so the
   shape reads as lobes rather than a random star. Light half first (cozy,
   silly, chatty, swingy), heavy half second, so light games lean one way.
   NB radar AREA is an artefact of this ordering -- read the spokes, not the fill. */
const AXES=["cozy","silly","chatty","swingy","cutthroat","crunchy","tense","storied"];
/* Axes the validation run flagged as not carried by the BGG tags. Populated by
   whoever runs vibes/validate_vibes.py; shown as a caveat, never auto-tuned. */
const LOW_CONF=[];
const vibeOf=g=>(typeof VIBES!=="undefined"?VIBES[String(g.id)]:null)||null;
/* Match on percentile, which is what the radar shows, so "70 cozy" means the
   same thing to the slider and to the chart. */
const axVal=(g,ax)=>{const v=vibeOf(g); return v&&v.pct&&ax in v.pct?v.pct[ax]:null;};

const axesSet=()=>AXES.some(a=>S.vibe[a]!==null);
function vibeActive(){return axesSet()||S.vplayers||S.vtime;}
/* Best fit first, but only once an axis is actually set -- with none, the
   reader's chosen sort order stands. */
const rankByFit=list=> !axesSet() ? list
  : list.map(g=>[g,matchScore(g)]).sort((a,b)=>(b[1]??-1)-(a[1]??-1)).map(x=>x[0]);

/* Hard filters run before scoring: player count, then time budget. */
function vibeEligible(g){
  if(S.vplayers){
    const v=vibeOf(g), best=v&&v.bestP;
    const ok = best&&best.length ? best.includes(S.vplayers)
                                 : (g.minP<=S.vplayers&&g.maxP>=S.vplayers);
    if(!ok) return false;
  }
  if(S.vtime && (g.time||0)>S.vtime) return false;
  return true;
}

/* Distance over requested axes only. Unset axes are ignored entirely --
   no implicit target. */
function matchScore(g){
  const use=AXES.filter(a=>S.vibe[a]!==null&&axVal(g,a)!==null);
  if(!use.length) return null;
  const sq=use.reduce((t,a)=>{const d=S.vibe[a]-axVal(g,a); return t+d*d;},0);
  return Math.round(100-Math.sqrt(sq/use.length));
}

function renderVibe(){
  let h=`<div class="fgroup"><div class="flabel">Tonight feels like…</div>`;
  AXES.forEach(a=>{
    const on=S.vibe[a]!==null, v=on?S.vibe[a]:50;
    h+=`<div class="vrow ${on?'on':'off'}">
      <button class="vtog" data-vax="${a}" title="${on?'ignore this axis':'use this axis'}">${on?'✓':'+'}</button>
      <span class="vname">${a}</span>
      <input type="range" min="0" max="100" step="5" value="${v}" data-vslide="${a}">
      <span class="vval">${on?v:'any'}</span>
    </div>`;
  });
  h+=`</div><div class="fgroup"><div class="flabel">Players at the table</div><div class="opts">`;
  for(let n=1;n<=8;n++) h+=`<button class="opt ${S.vplayers===n?'on':''}" data-vp="${n}">${n}</button>`;
  h+=`</div></div><div class="fgroup"><div class="flabel">Time budget</div><div class="opts">`;
  TIME_OPTS.forEach(o=>h+=`<button class="opt ${S.vtime===o.v?'on':''}" data-vt="${o.v}">${o.l}</button>`);
  h+=`<button class="opt" data-vreset="1">Reset</button></div></div>`;
  $("#vibe").innerHTML=h;
}

/* Radar of the percentile scores, one spoke per axis. */
function radar(g,size){
  const v=vibeOf(g); if(!v||!v.pct) return "";
  const short=size<200;                       // small radar truncates labels, big one spells them
  const R=size/2-(short?40:56), cx=size/2, cy=size/2;
  const pt=(i,r)=>{const th=-Math.PI/2+i*2*Math.PI/AXES.length;
    return [cx+Math.cos(th)*r, cy+Math.sin(th)*r];};
  const ring=r=>AXES.map((_,i)=>pt(i,r).map(n=>n.toFixed(1)).join(",")).join(" ");
  const poly=AXES.map((a,i)=>pt(i,R*(v.pct[a]??0)/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  const labels=AXES.map((a,i)=>{const[x,y]=pt(i,R+(short?9:13));
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle"
      font-size="${short?8.5:9.5}" fill="${v.src&&v.src[a]==='manual'?'var(--acc2)':'var(--dim)'}">${short?a.slice(0,4):a}</text>`;}).join("");
  /* Outer ring naming the two halves. The axis order puts the axes that fall with
     complexity first and those that rise with it second, and the lean between the
     halves tracks BGG weight at r=+0.87 -- so the ring describes something real
     rather than decorating the chart.
     Caveat: swingy is the one axis with no relationship to weight (r=-0.01). It
     sits last in the light half, i.e. right on the seam, which is the least wrong
     place for it -- but a very swingy game will tug the shape "lighter" without
     actually being lighter. The small radar draws the same ring a touch tighter
     and a point smaller; both sizes reserve the margin the ring labels need. */
  const n=AXES.length, step=360/n, half=step/2;
  const polar=(deg,r)=>{const t=deg*Math.PI/180;return [cx+Math.cos(t)*r, cy+Math.sin(t)*r];};
  const arc=(a0,a1,r)=>{const[x0,y0]=polar(a0,r),[x1,y1]=polar(a1,r);
    return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;};
  const rr=R+(short?20:27), start=-90-half;            // ring sits outside the axis labels
  const segs=[[start, start+step*(n/2), "lighter"],
              [start+step*(n/2), start+360, "heavier"]];
  const gap=5;                                         // break at each seam, so it reads as two halves not one ring
  const meta=segs.map(([a0,a1,txt])=>{
    const[lx,ly]=polar((a0+a1)/2, rr+(short?9:10));
    return `<path d="${arc(a0+gap,a1-gap,rr)}" fill="none" stroke="var(--dimmer)" stroke-width="1.5" opacity=".45"/>
      <text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle"
        font-size="${short?7.5:8.5}" letter-spacing=".08em" fill="var(--dimmer)">${txt}</text>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="vibe radar">
    ${meta}
    <polygon points="${ring(R)}" fill="none" stroke="var(--line)"/>
    <polygon points="${ring(R*0.5)}" fill="none" stroke="var(--line)" opacity=".55"/>
    <polygon points="${poly}" fill="var(--accfill)" stroke="var(--acc2)" stroke-width="1.6"/>
    ${labels}</svg>`;
}

/* Vibe block for the game sheet: radar plus a per-axis readout, because the
   radar shows the shape and the bars give you the actual numbers. */
function vibeSection(g){
  const v=vibeOf(g);
  if(!v||!v.pct) return "";
  const rows=AXES.map(a=>{
    if(!(a in v)) return "";
    const man=v.src&&v.src[a]==="manual", low=LOW_CONF.includes(a);
    // Bar and number are both the percentile, so they agree with each other and
    // with the radar. Raw score sits in the tooltip -- it is the stored value,
    // but "higher than 78% of the shelf" is what actually means something here.
    return `<div class="vbrow">
      <span class="vbname${low?' low':''}" title="${man?'hand-scored':'from BGG tags'}${low?' · low-confidence axis':''}">${a}${man?'<i>✎</i>':''}</span>
      <span class="vbbar" title="raw score ${v[a]}"><i style="width:${v.pct[a]}%"></i></span>
      <span class="vbval">${v.pct[a]}</span>
    </div>`;
  }).join("");
  const hand=AXES.filter(a=>v.src&&v.src[a]==="manual").length;
  return `<div class="sect">Vibe</div>
    <div class="vibebox">
      <div class="vradar">${radar(g,236)}</div>
      <div class="vbars">${rows}</div>
    </div>
    <div class="vfoot">Each axis is this game's percentile across your ${GAMES.length} games — 80 means cosier
      than 80% of the shelf. Hover a bar for the raw score.
      ${hand?`${hand} axis${hand>1?"es":""} hand-scored (✎).`:"All axes scored from BGG tags."}
      ${v.note?`<br>${esc(v.note)}`:""}</div>`;
}

function renderTonight(list){
  const box=$("#tonight");
  if(!vibeActive()||!list.length){box.innerHTML="";return;}
  const g=list[0], sc=matchScore(g), v=vibeOf(g);
  const flagged=AXES.filter(a=>S.vibe[a]!==null&&LOW_CONF.includes(a));
  let bar="";
  if(v&&v.bestP&&v.bestP.length){
    bar=`<div class="bestbar">`;
    for(let n=g.minP;n<=Math.min(g.maxP,8);n++)
      bar+=`<span class="${v.bestP.includes(n)?'best':''}">${n}p</span>`;
    bar+=`</div>`;
  }
  box.innerHTML=`<div class="tonight">
    <div class="tmain">
      <div class="teyebrow">Best fit tonight</div>
      <h2>${esc(g.name)}</h2>
      <div class="tmeta">${plStr(g)} · ${timeRange(g)} · ${wLabel(g.weight)}</div>
      ${bar}
    </div>
    <div style="text-align:center">
      <div class="tscore">${sc===null?"–":sc+"%"}</div>
      <div class="teyebrow">match${flagged.length?`<span class="lowconf">${flagged.join(", ")} low-confidence</span>`:""}</div>
    </div>
    ${radar(g,186)}
  </div>`;
}

function render(){ renderQuick(); renderVibe(); renderList(); syncPressed(); }

/* The list half of a render. Split out because dragging a vibe slider must not
   rebuild the panel holding that slider -- see the #vibe input handler. */
function renderList(){
  const list=rankByFit(sorted(GAMES.filter(matches).filter(vibeEligible)));
  renderTonight(list);
  $("#count").textContent = list.length===GAMES.length ? GAMES.length+" games" : list.length+" of "+GAMES.length;
  $("#empty").style.display = list.length ? "none" : "block";
  $("#grid").innerHTML = list.map(g=>{
    const m=matchScore(g);   // bottom-left holds one badge: fit score outranks the teach flag
    return `
    <button class="card" data-id="${g.id}">
      <div class="thumbwrap">
        ${g.rating?`<span class="rbadge" style="color:${g.rating>=8?'var(--acc)':g.rating>=7?'var(--acc2)':'var(--dim)'}">★ ${g.rating.toFixed(1)}</span>`:""}
        <span class="wbadge" style="color:${wColor(g.weight)}">${g.weight?g.weight.toFixed(1):"–"}</span>
        ${g.awards?`<span class="abadge">${esc(awardShort(g))}</span>`:""}
        <div class="botleft">
          ${g.video?`<span class="vbadge">▶ teach</span>`:""}
          ${m===null?"":`<span class="mscore">${m}% fit</span>`}
        </div>
        <img loading="lazy" src="${esc(g.thumb||"")}" alt="">
      </div>
      <div class="cardbody">
        <div class="cname">${esc(g.name)}</div>
        <div class="crow"><span><b>${plStr(g)}</b></span><span><b>${timeStr(g.time)}</b></span>${g.myRating?`<span style="margin-left:auto;color:var(--warm)"><b>♥ ${g.myRating}</b></span>`:""}</div>
        <div class="wbar"><i style="width:${Math.min(100,(g.weight/5)*100)}%;background:${wColor(g.weight)}"></i></div>
      </div>
    </button>`;
  }).join("");
}

/* ---------- detail sheet ---------- */
let sheetOpener=null;                          // where focus goes when the sheet closes
function openGame(id){
  const g=GAMES.find(x=>x.id==id); if(!g) return;
  sheetOpener=document.activeElement;
  const bp=(vibeOf(g)||{}).bestP||[];          // the player-count poll lives in VIBES
  $("#sheetTitle").textContent=g.name;
  const ytSearch="https://www.youtube.com/results?search_query="+encodeURIComponent("how to play "+g.name+" board game");
  $("#sheetBody").innerHTML=`
    <div class="hero">
      <img src="${esc(g.thumb||"")}" alt="">
      <div class="meta">
        <h2>${esc(g.name)}</h2>
        <div class="yr">${g.year||""}${g.rank?" · BGG rank #"+g.rank:""}</div>
        <div class="tags">
          ${bp.length?`<span class="tag best">Best at ${bp.join(" / ")}</span>`:""}
          <span class="tag">${wLabel(g.weight)}</span>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Players</div><div class="v">${plStr(g)}</div><div class="s">${bp.length?"best at "+bp.join("/"):"&nbsp;"}</div></div>
      <div class="stat"><div class="k">Play time</div><div class="v">${timeRange(g)}</div><div class="s">&nbsp;</div></div>
      <div class="stat"><div class="k">Complexity</div><div class="v" style="color:${wColor(g.weight)}">${g.weight?g.weight.toFixed(2):"–"}</div><div class="s">${wLabel(g.weight)} · of 5</div></div>
      <div class="stat"><div class="k">Rating</div><div class="v">${g.rating?g.rating.toFixed(1):"–"}</div><div class="s">${g.myRating?"you rated "+g.myRating:"BGG average"}${g.plays?" · "+g.plays+" play"+(g.plays>1?"s":""):""}</div></div>
    </div>

    ${vibeSection(g)}

    <div class="sect">How to play</div>
    ${g.video?`
      <div class="vidwrap" id="vid" data-yt="${g.video}">
        <img class="vidposter" src="https://i.ytimg.com/vi/${g.video}/hqdefault.jpg" alt="">
        <div class="playbtn"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="#0e1116"><path d="M8 5v14l11-7z"/></svg></span></div>
      </div>
      <div class="vmeta">${esc(g.vtitle||"Teach video")}${g.vchan?" · "+esc(g.vchan):""}</div>`
    :`<a class="novid" href="${ytSearch}" target="_blank" rel="noopener">Search YouTube for a teach video →</a>`}

    ${g.desc?`<div class="sect">About</div><div class="desc">${esc(g.desc)}</div>`:""}
    ${g.note?`<div class="sect">My note</div><div class="desc">${esc(g.note)}</div>`:""}

    ${(g.awards&&g.awards.length)||g.dt?`<div class="sect">Awards</div><div class="awards">${
      (g.awards||[]).map(a=>`<div class="award"><span class="medal">\u{1F3C5}</span><span>${esc(a)}</span></div>`).join("")
    }${g.dt?`<div class="award dt"><span class="medal">\u{1F3AF}</span><span>Dice Tower ${g.dt==="hof"?"Hall of Fame":"Essentials"}</span></div>`:""}</div>`:""}
    ${(g.mech&&g.mech.length)?`<div class="sect">Mechanics</div><div class="tags">${g.mech.map(m=>`<span class="tag">${esc(m)}</span>`).join("")}</div>`:""}
    ${(g.cat&&g.cat.length)?`<div class="sect">Themes</div><div class="tags">${g.cat.map(m=>`<span class="tag">${esc(m)}</span>`).join("")}</div>`:""}

    <div class="links">
      <a href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener">BGG page</a>
      <a href="${ytSearch}" target="_blank" rel="noopener">More videos</a>
    </div>`;
  $("#sheet").classList.add("open");
  $("#sheet").scrollTop=0;
  $("#close").focus({preventScroll:true});
  document.body.style.overflow="hidden";
  history.pushState({sheet:1},"");
}
function closeSheet(){
  $("#sheet").classList.remove("open");
  $("#sheetBody").innerHTML="";
  document.body.style.overflow="";
  /* Hand focus back to the card that opened it -- unless a filter change has
     since rebuilt the grid and that card no longer exists. */
  if(sheetOpener&&document.contains(sheetOpener)) sheetOpener.focus({preventScroll:true});
  sheetOpener=null;
}

/* ---------- events ---------- */
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
/* ---------- theme ---------- */
const THEME_KEY="gn-theme";
const sysDark=()=>matchMedia("(prefers-color-scheme: dark)").matches;
const isDark=()=>{const t=document.documentElement.dataset.theme; return t?t==="dark":sysDark();};
function syncTheme(){
  const dark=isDark();
  document.querySelector('meta[name="theme-color"]').setAttribute("content",dark?"#0e1116":"#f4f6f8");
  const b=$("#theme");
  b.setAttribute("aria-label", dark?"Switch to light mode":"Switch to dark mode");
  b.setAttribute("title", b.getAttribute("aria-label"));
}
$("#theme").addEventListener("click",()=>{
  const next=isDark()?"light":"dark";
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  syncTheme();
});
/* follow the OS while the reader has not pinned a choice */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{
  if(!document.documentElement.dataset.theme) syncTheme();
});
syncTheme();

$("#vtoggle").addEventListener("click",()=>{
  const d=$("#vibe"); d.classList.toggle("open"); $("#vtoggle").classList.toggle("on",d.classList.contains("open"));
});
$("#vibe").addEventListener("input",e=>{
  const a=e.target.dataset.vslide; if(!a) return;
  S.vibe[a]=+e.target.value;
  /* Sync this row by hand. Calling render() here would replace the range input
     under the reader's finger, which ends the drag every 5 points. */
  const row=e.target.closest(".vrow"), tog=row.querySelector(".vtog");
  row.className="vrow on";
  tog.textContent="✓"; tog.title="ignore this axis"; tog.setAttribute("aria-pressed","true");
  row.querySelector(".vval").textContent=S.vibe[a];
  renderList();
});
$("#vibe").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.vax){const a=b.dataset.vax; S.vibe[a]= S.vibe[a]===null ? +$(`[data-vslide="${a}"]`).value : null;}
  else if(b.dataset.vp) S.vplayers = S.vplayers==+b.dataset.vp ? 0 : +b.dataset.vp;
  else if(b.dataset.vt) S.vtime = S.vtime==+b.dataset.vt ? 0 : +b.dataset.vt;
  else if(b.dataset.vreset){AXES.forEach(a=>S.vibe[a]=null); S.vplayers=0; S.vtime=0;}
  else return;
  render();
});
$("#ftoggle").addEventListener("click",()=>{
  const d=$("#drawer"); d.classList.toggle("open"); $("#ftoggle").classList.toggle("on",d.classList.contains("open"));
});
$("#dice").addEventListener("click",()=>{
  const list=rankByFit(GAMES.filter(matches).filter(vibeEligible)); if(!list.length) return;
  /* rankByFit puts the best fits first, so with an axis set the roll stays among
     them -- a uniform pick would hand you a 20% match straight after you said
     what tonight feels like. */
  const pool=axesSet()?list.slice(0,10):list;
  openGame(pool[Math.floor(Math.random()*pool.length)].id);
});
$("#quick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.clear){Object.assign(S,{players:0,twoOnly:false,time:0,weight:"",mech:"",vid:false,award:false});}
  else if(b.dataset["2"]) S.twoOnly=!S.twoOnly;
  else if(b.dataset.v) S.vid=!S.vid;
  else if(b.dataset.a) S.award=!S.award;
  else if(b.dataset.p) S.players = S.players==+b.dataset.p ? 0 : +b.dataset.p;
  else if(b.dataset.t) S.time = S.time==+b.dataset.t ? 0 : +b.dataset.t;
  renderDrawer(); render();
});
$("#drawer").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.w) S.weight = S.weight===b.dataset.w ? "" : b.dataset.w;
  else if(b.dataset.m) S.mech = S.mech===b.dataset.m ? "" : b.dataset.m;
  else if(b.dataset.s) S.sort = b.dataset.s;
  renderDrawer(); render();
});
$("#grid").addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(c) openGame(c.dataset.id);
});
$("#close").addEventListener("click",()=>history.back());
$("#sheetBody").addEventListener("click",e=>{
  const v=e.target.closest("#vid"); if(!v) return;
  v.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.dataset.yt}?autoplay=1&rel=0&playsinline=1" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
});
window.addEventListener("popstate",()=>{ if($("#sheet").classList.contains("open")) closeSheet(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#sheet").classList.contains("open")) history.back();
});

/* A reload with the sheet open leaves its history entry behind, which makes the
   first Back look broken. Drop it. */
if(history.state&&history.state.sheet) history.replaceState(null,"");

$("#foot").textContent=UPDATED;
renderDrawer(); render();
</script>
</body>
</html>
